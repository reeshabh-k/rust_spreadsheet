[package]
name = "backend"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyper = "1"
tower-http = { version = "0.5", features = ["cors"] }
arrayvec = "0.7"
regex = "1.9"
once_cell = "1.18"