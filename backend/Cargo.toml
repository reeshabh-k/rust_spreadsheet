[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version ="0.8.3"}
hyper = "1"
tower-http = { version = "0.6.2", features = ["cors"] }
arrayvec = "0.7"
regex = "1.9"
once_cell = "1.18"
reqwest = { version = "0.12.15", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
