[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
helper = {path = "./helper"}
yew = {version= "0.20", features = ["csr"]}
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "HtmlInputElement", 
    "InputEvent", 
    "KeyboardEvent",
    "Document", 
    "Window", 
    "Element",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "FileReader",
    "FileList",
    "File",
    "HtmlElement",
    "CssStyleDeclaration"
]}
wasm-bindgen = "0.2.100"
js-sys = "0.3.67"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
trunk = "0.21.13"
ordered-float = "5.0.0"

